name: cicd-pipeline

# CI/CD Pipeline for GitHub Actions
# Triggers: merge to master, tag push (staging-*, sre-*), manual trigger
# Runs on self-hosted runner with jobs: prepare, build, update vault, deploy

on:
  pull_request:
    types: [closed]
    branches:
      - master
  push:
    tags:
      - 'staging-*'
      - 'sre-*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (optional, for manual versioning)'
        required: false
        type: string

env:
  PROJECT: "BACKEND"
  DEPLOYER: ${{ github.actor }}
  SERVICE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.ref_name }}
  ENV: "staging"
  # AWS_CONFIG_DIR: "$CI_PROJECT_DIR/.aws"

  ### Notification Channel Slack
  CHANNEL_SLACK_STAGING: "#deployment-v4"
  CHANNEL_SLACK_PRODUCTION: "#be-deployment-production"
  APP_VERSION: ${{ github.ref_name }}
  USER_DEPLOY: ${{ github.actor }}

jobs:
  # Get Login ECR
  get-ecr-creds:
    runs-on: [self-hosted]
    outputs:
      ecr_password: ${{ steps.login.outputs.password }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Get ECR Password
        id: login
        # Use amazon-ecr-login or a CLI command to output the password
        run: |
          PASSWORD=$(aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION }})
          echo "password=${PASSWORD}" >> "$GITHUB_OUTPUT"
  
  # Job 1: Preparation stage - setup environment, validate configs
  prepare:
    name: Preparing Deployment ${{ github.repository }} - ${{ github.ref_name }}
    needs: get-ecr-creds
    runs-on: [self-hosted]
    container:
      image: ubuntu:20.04
      credentials:
        username: AWS
        password: ${{ needs.get-ecr-creds.outputs.ecr_password }}
      options: --privileged
    outputs:
      build_tag: ${{ steps.tag.outputs.build_tag }}
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version_tag }}" ]]; then
            BUILD_TAG="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            BUILD_TAG="$(echo "${{ github.ref }}" | sed 's|refs/tags/||')"
          else
            BUILD_TAG="${{ github.sha }}"
          fi
          echo "build_tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "Build tag: ${BUILD_TAG}"

      - name: Check deployment conditions
        id: check
        run: |
          DEPLOY=false
          
          # Deploy on PR merge to master
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" && "${{ github.base_ref }}" == "master" ]]; then
            DEPLOY=true
            echo "Deployment triggered: PR merged to master"
          fi
          
          # Deploy on staging-* or sre-* tags
          if [[ "${{ github.ref }}" == refs/tags/staging-* || "${{ github.ref }}" == refs/tags/sre-* ]]; then
            DEPLOY=true
            echo "Deployment triggered: Tag push (staging-* or sre-*)"
          fi
          
          # Manual trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DEPLOY=true
            echo "Deployment triggered: Manual workflow_dispatch"
          fi
          
          echo "should_deploy=${DEPLOY}" >> $GITHUB_OUTPUT

      - name: Validate environment
        run: |
          echo "Validation: Checking environment setup..."
          env | sort

  # Job 2: Build stage - compile, test, build artifacts
  build:
    name: Build
    runs-on: [self-hosted]
    container:
      image: 475170104714.dkr.ecr.ap-southeast-1.amazonaws.com/docker:25.0.0
      credentials:
        username: AWS
        password: ${{ needs.get-ecr-creds.outputs.ecr_password }}
      options: --privileged
    needs: [get-ecr-creds, prepare]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: Build Docker image
        if: needs.prepare.outputs.should_deploy == 'true'
        env:
          IMAGE_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/${{ github.repository }}:${{ github.ref_name }}
        run: |
          echo "Building Docker image: ${{ env.IMAGE_REGISTRY }}"
          docker build -t ${{ env.IMAGE_REGISTRY }} .
          docker push ${{ env.IMAGE_REGISTRY }}

